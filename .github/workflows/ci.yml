# ============================================================================
# CI — runs on every PR and every push to main.
#
# Nothing here touches AWS or pushes an image. This job only answers "does the
# code compile and do the tests pass", so it needs no cloud credentials at all
# and is safe to run on pull requests from any branch.
#
# Deployment is NOT in this file and not in a cd.yml — there is no such file.
# It is build-images.yml, which pushes to ECR on a green main and then
# dispatches to a separate DEPLOY repo holding docker-compose.prod.yml:
#
#   source (here) --build--> ECR --dispatch--> deploy repo --> EC2
#
# Said plainly because the previous wording pointed at a cd.yml that has never
# existed, and anyone auditing this repo for a deployment path concluded there
# was none.
# ============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the first — no point paying for CI
# on a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Each backend service is its own independent Maven project — there is no
  # aggregator pom at backend/, so they build in parallel rather than as one
  # reactor. The matrix mirrors the service list in docker-compose.yml.
  # --------------------------------------------------------------------------
  backend:
    name: backend / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # One service failing should not hide the results of the others.
      fail-fast: false
      matrix:
        service:
          - agent-service
          - alert-service
          - api-gateway
          - auth-service
          - core-service
          - job-service
          - plugin-service
          - rundeck-service
          - subscription-service
          - voice-agent
          - workflow-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          # Keyed on every pom.xml so a dependency bump in one service does not
          # invalidate the cache for the others.
          cache: maven

      - name: Build and test
        working-directory: backend/${{ matrix.service }}
        # -B batch mode (no ANSI progress spam in the log)
        # -ntp suppresses the "Downloading..." wall of transfer output
        # verify runs compile + unit tests + any integration-test bindings
        run: mvn -B -ntp verify

      # Surfaces failures as an annotated table on the PR instead of making you
      # dig through raw log output to find which assertion broke.
      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        # Runs even when the build failed — that is exactly when the report matters.
        if: always()
        with:
          report_paths: backend/${{ matrix.service }}/target/surefire-reports/TEST-*.xml
          check_name: tests / ${{ matrix.service }}
          # The build step already failed the job; do not fail it a second time.
          fail_on_failure: false

  # --------------------------------------------------------------------------
  # agent-runtime is Python, so it is invisible to the Maven matrix above — and
  # until this job existed its tests had never run on a pull request at all.
  #
  # It gates three things that reach a customer's production cloud:
  #   * the reducer and the phase graphs (pytest), including the golden replays
  #     that pin how each shipped agent behaves step by step;
  #   * the boto3 automation bodies, exercised against a stubbed AWS — these are
  #     the only scripts here that run against a real account, and one of them
  #     deletes disks;
  #   * the authored workflow JSON, against its schema and against the body
  #     scripts it is generated from.
  # --------------------------------------------------------------------------
  agent-runtime:
    name: agent-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/agent-runtime/pyproject.toml

      - name: Install
        working-directory: backend/agent-runtime
        # jsonschema is not a runtime dependency — it is only needed by the
        # authoring validator below, which does not ship in the image.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" jsonschema

      - name: Lint
        working-directory: backend/agent-runtime
        # The automation bodies live in agent-service but are Python, and this
        # is the only job with an interpreter — unlinted, they are the scripts
        # least able to afford it.
        run: |
          ruff check .
          ruff check --line-length 100 ../agent-service/workflows/_authoring
          ruff check --line-length 100 ../agent-service/agents/_schema

      - name: Tests
        working-directory: backend/agent-runtime
        run: pytest -q

      # Run explicitly as well as through pytest. The schema validator covers
      # the AGENTS tree too, which pytest does not reach, and a readable pass
      # list in the log is what someone checks after authoring a new workflow.
      - name: Validate authored agents and workflows
        run: python backend/agent-service/agents/_schema/validate.py

      - name: Check workflow JSON matches its body scripts
        run: python backend/agent-service/workflows/_authoring/generate.py --check

  # --------------------------------------------------------------------------
  # Frontend: lint, unit tests, then a real production build. The build step is
  # not redundant with the tests — Vite resolves imports and tree-shakes only at
  # build time, so a broken import can pass vitest and still fail `vite build`.
  # --------------------------------------------------------------------------
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # `ci` not `install` — installs exactly the lockfile and fails if
        # package.json and package-lock.json have drifted apart.
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Production build
        working-directory: frontend
        run: npm run build

  # --------------------------------------------------------------------------
  # Secret scanning. The repo is private, but a leaked key is just as live
  # whether or not the repo is public — an accidental `git add .env` is exactly
  # the failure this catches, and .env holds CLOUD_CRED_KEY, which cannot be
  # rotated without making every stored customer integration undecryptable.
  # --------------------------------------------------------------------------
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks diffs commit ranges, so it needs real history, not the
          # default depth-1 shallow clone.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
