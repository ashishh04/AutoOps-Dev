app:
  description: Turns raw meeting notes into an owner-and-action table plus a ready-to-send follow-up email.
  icon: 📋
  icon_background: '#E0F2FE'
  icon_type: emoji
  mode: workflow
  name: Meeting Actions and Follow-up
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.61@8178deea650bcea1d301ec362d78b35141fcfbc57c56e5e6a7629e13a41d7672
    version: null
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: e_start_writer
      source: start
      sourceHandle: source
      target: writer
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: e_writer_end
      source: writer
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - default: ''
          hint: Paste your raw notes. Bullet points and half-sentences are fine.
          label: Meeting notes
          max_length: 8000
          options: []
          required: true
          type: paragraph
          variable: notes
        - default: ''
          hint: 'Example: Weekly delivery sync — Ashish, Priya, client PM'
          label: Meeting and attendees
          max_length: 500
          options: []
          required: false
          type: text-input
          variable: meeting_context
        - default: Direct
          hint: ''
          label: Email tone
          max_length: 64
          options:
          - Direct
          - Formal
          - Friendly
          required: true
          type: select
          variable: tone
      height: 240
      id: start
      position:
        x: 80
        y: 300
      positionAbsolute:
        x: 80
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      zIndex: 0
    - data:
        context:
          enabled: false
        desc: Extracts decisions and actions, then drafts the follow-up email.
        model:
          completion_params:
            temperature: 0.2
            top_p: 0.9
          mode: chat
          name: deepseek-v4-pro
          provider: langgenius/openai_api_compatible/openai_api_compatible
        outputs: []
        prompt_template:
        - id: 96da62fc-d1de-47ec-b066-e7d335531a2e
          role: system
          text: 'You turn messy meeting notes into something people can act on. Output markdown with exactly
            three sections:


            ## Decisions

            Bullets. Only decisions actually made. If none were, say ''No decisions were recorded.''


            ## Actions

            A table: Action | Owner | Due. One action per row, each starting with a verb.


            ## Follow-up email

            A complete email — subject line and body — that could be sent without editing.


            RULES YOU MUST NOT BREAK:

            - EVERY action needs an owner. If the notes do not name one, write ''Owner not assigned''
            — never guess, and never quietly assign it to whoever spoke last. An unassigned action that
            is visible gets picked up; one assigned to the wrong person gets ignored by both of them.

            - Never invent a due date. If none was given, write ''Not set''.

            - Never invent an attendee, a commitment or a number.

            - Do not pad. Six real actions beat twelve where half were never agreed.

            - Keep the email under 200 words. Nobody reads a long follow-up.


            If anything important was clearly left unresolved, add one line at the very end beginning
            ''Unresolved:'' — that is usually the most valuable sentence in the document.'
        - id: 6f31f074-1034-40fa-98ae-a0139337ef4c
          role: user
          text: 'Meeting: {{#start.meeting_context#}}

            Email tone: {{#start.tone#}}


            Notes:

            {{#start.notes#}}'
        selected: false
        title: Actions and Email Writer
        type: llm
        variables: []
        vision:
          enabled: false
      height: 110
      id: writer
      position:
        x: 420
        y: 300
      positionAbsolute:
        x: 420
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      zIndex: 0
    - data:
        desc: Return the finished document.
        outputs:
        - type: string
          value_selector:
          - writer
          - text
          variable: final_report
        selected: false
        title: End
        type: end
      height: 90
      id: end
      position:
        x: 760
        y: 300
      positionAbsolute:
        x: 760
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      zIndex: 0
    viewport:
      x: 0
      y: 0
      zoom: 0.8
