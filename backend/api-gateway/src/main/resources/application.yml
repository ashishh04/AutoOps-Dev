server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short, because a slow counter must not become slow traffic. The
      # limiter fails OPEN on timeout, so the cost of a Redis stall is an
      # unlimited window rather than a stalled request.
      timeout: 250ms
      connect-timeout: 250ms
  cloud:
    gateway:
      mvc:
        routes:
          # Identity flows + JWKS/introspection pass straight to auth-service.
          - id: auth-service
            uri: ${AUTH_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/auth/**,/oauth2/**
          # Plans, subscriptions, entitlements, payments.
          - id: subscription-service
            uri: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/plans/**,/api/subscriptions/**,/api/entitlements/**,/api/payments/**,/api/provider/tenants,/api/provider/payments,/api/provider/plans/**,/api/provider/audit
          # Workflow RUNS stay with the execution engine in core-service, so
          # this MORE SPECIFIC route must be declared BEFORE workflow-service's
          # /api/workflows/** — Spring Cloud Gateway matches routes in order and
          # the first predicate wins.
          # /inputs and /readiness ride with /run for the same reason: both are
          # resolved by the EXECUTION side — the input form and the "can this
          # workspace actually run it" check both need the tenant's model
          # connections and jobs, which workflow-service does not have. Left off
          # this list they fall through to workflow-service and 404 there, and a
          # 404 on /readiness blocks every run because the console asks it first.
          - id: core-service-workflow-runs
            uri: ${CORE_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/api/workflows/*/run,/api/workflows/*/inputs,/api/workflows/*/readiness
          # Workflow definitions (CRUD, enable/disable).
          - id: workflow-service
            uri: ${WORKFLOW_SERVICE_URL:http://localhost:8086}
            predicates:
              - Path=/api/workflows/**,/api/projects/*/workflows/**,/api/projects/*/workflows
          # AI agents, and their runs.
          #
          # /api/agent-runs/** is listed explicitly. It does NOT match
          # /api/agents/**, so without it the run detail and cancel calls fall
          # through to the catch-all core-service route below and 404 there —
          # from a service that has never heard of an agent run.
          - id: agent-service
            uri: ${AGENT_SERVICE_URL:http://localhost:8087}
            predicates:
              - Path=/api/agents/**,/api/agent-runs/**,/api/projects/*/agents/**,/api/projects/*/agents,/api/provider/fleet/agents
          # Notification channels and the rules that fire them.
          # /api/notification-rules/** does NOT collide with core-service's
          # /api/notifications/** below — different literal segment — but the
          # two are easy to confuse: that one is the in-app inbox, this one is
          # outbound delivery to Slack/Teams/Outlook/Gmail/GitHub.
          - id: plugin-service
            uri: ${PLUGIN_SERVICE_URL:http://localhost:8088}
            predicates:
              - Path=/api/plugins/**,/api/notification-rules/**
          # A tenant's OWN Rundeck server: connections, job browsing, dispatch,
          # log relay and the node inventory. Nothing under /api/rundeck/**
          # overlaps another route's prefix, so its position here is not
          # load-bearing — unlike the workflow-run exception above.
          - id: rundeck-service
            uri: ${RUNDECK_SERVICE_URL:http://localhost:8090}
            predicates:
              - Path=/api/rundeck/**
          # The alert plane: alerts and the incidents they correlate into.
          # Read-only, and the engine behind it is invisible — alert-service is
          # the only thing that holds its address, exactly as rundeck-service is
          # for execution. Neither /api/alerts/** nor /api/incidents/** overlaps
          # another route's prefix, so this position is not load-bearing.
          # /api/alert-providers/** is listed EXPLICITLY. It does NOT match
          # /api/alerts/** — "alerts" and "alert-providers" are different
          # literal segments — so without it the connect screen's calls fall
          # through every route and 404 at the gateway. The symptom is not a
          # 401: the gateway authenticates BEFORE it routes, so an
          # unauthenticated probe returns 401 whether the route exists or not.
          # Only a request with a real token tells you anything.
          - id: alert-service
            uri: ${ALERT_SERVICE_URL:http://localhost:8091}
            predicates:
              - Path=/api/alerts/**,/api/incidents/**,/api/alert-providers,/api/alert-providers/**,/api/provider/fleet/alerts,/api/provider/fleet/incidents
          # Projects, jobs, cloud integrations, runs (subscription-gated mutations).
          - id: core-service
            uri: ${CORE_SERVICE_URL:http://localhost:8083}
            predicates:
              # /api/provider/tenants (exact) is subscription-service's billing
              # view; the .../projects sub-path below is core-service's — the
              # patterns do not overlap, so ordering between the two is not
              # load-bearing.
              - Path=/api/projects/**,/api/jobs/**,/api/cloud/**,/api/runs/**,/api/approvals/**,/api/compliance/**,/api/governance/**,/api/audit/**,/api/notifications/**,/api/nodes/**,/api/secrets/**,/api/webhooks/**,/api/hooks/**,/api/library/**,/api/commands/**,/api/connectors/**,/api/model-providers/**,/api/provider/usage,/api/provider/health,/api/provider/broadcasts,/api/provider/library,/api/provider/library/*,/api/provider/tenants/*/projects,/api/provider/rollout,/api/provider/rollout/**,/api/provider/authoring/**
          # Aegis-01, the landing-page voice agent. Anonymous by design —
          # visitors have no account yet — so voice-agent caps it itself.
          - id: voice-agent
            uri: ${VOICE_SERVICE_URL:http://localhost:8085}
            predicates:
              - Path=/api/voice/**

autoops:
  gateway:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      # Per TENANT, per window. Generous on purpose: a limiter that trips on
      # normal use gets switched off by whoever is on call, and then there is
      # no limiter at all.
      requests: ${RATE_LIMIT_REQUESTS:600}
      window: ${RATE_LIMIT_WINDOW:1m}
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/oauth2/jwks}
    issuer: ${JWT_ISSUER:autoops-auth-service}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    redis:
      # OFF, and this is not a convenience.
      #
      # Adding spring-boot-starter-data-redis for the rate limiter brought a
      # Redis health indicator with it, so /actuator/health began reporting 503
      # whenever Redis was unreachable — and the orchestrator kills a container
      # that fails its liveness probe.
      #
      # That would have defeated the entire design. RateLimitFilter deliberately
      # fails OPEN so a Redis incident costs the limiter and nothing else; a
      # health check that takes the gateway down on the same event just moves
      # the outage rather than preventing it. Redis is not a dependency this
      # service needs in order to route traffic, so it is not part of whether
      # this service is healthy.
      enabled: false
