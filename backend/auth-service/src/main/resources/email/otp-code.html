<h1 style="margin:0 0 12px 0;font-size:22px;line-height:30px;font-weight:700;color:#0f172a;">
  Your verification code
</h1>

<p style="margin:0 0 28px 0;font-size:15px;line-height:24px;color:#475569;">
  Enter this code to finish signing in to AutoOps.
</p>

<!-- The code is the entire point of the email, so it is selectable text rather
     than an image, monospace so 0 and O are distinguishable, and spaced so it
     can be read off a phone screen and typed into a laptop. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td align="center" style="background-color:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:24px 16px;">
      <div style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:34px;line-height:42px;font-weight:700;letter-spacing:8px;color:#0f172a;">
        {{code}}
      </div>
    </td>
  </tr>
</table>

<p style="margin:24px 0 0 0;font-size:14px;line-height:22px;color:#475569;">
  It expires in <strong style="color:#0f172a;">{{ttl}}</strong>.
</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td style="padding:24px 0 0 0;">
      <div style="border-top:1px solid #e2e8f0;"></div>
    </td>
  </tr>
</table>

<p style="margin:20px 0 0 0;font-size:13px;line-height:21px;color:#64748b;">
  Didn't ask for this? You can ignore this email &mdash; the code is useless
  without your email address, and nothing changes until it is used.
</p>
