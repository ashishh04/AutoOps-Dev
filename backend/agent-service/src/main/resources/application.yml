server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: agent-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:autoops_agent}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:autoops}
    password: ${DB_PASSWORD:autoops}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

autoops:
  agent:
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/oauth2/jwks}
    issuer: ${JWT_ISSUER:autoops-auth-service}
    subscription:
      base-url: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8082}
      connect-timeout: ${SUBSCRIPTION_CONNECT_TIMEOUT:2s}
      read-timeout: ${SUBSCRIPTION_READ_TIMEOUT:3s}
      # FAIL-CLOSED default: mutations are denied when subscription-service is down.
      entitlement-fail-open: ${ENTITLEMENT_FAIL_OPEN:false}
    # core-service owns projects, jobs and the audit trail; workflow-service
    # owns workflows. An agent's tools allow-list is validated against both.
    core:
      base-url: ${CORE_SERVICE_URL:http://localhost:8083}
      internal-token: ${CORE_INTERNAL_TOKEN:dev-internal-token}
      connect-timeout: ${CORE_CONNECT_TIMEOUT:2s}
      read-timeout: ${CORE_READ_TIMEOUT:5s}
    workflow:
      base-url: ${WORKFLOW_SERVICE_URL:http://localhost:8086}
      internal-token: ${WORKFLOW_INTERNAL_TOKEN:dev-internal-token}
      connect-timeout: ${WORKFLOW_CONNECT_TIMEOUT:2s}
      read-timeout: ${WORKFLOW_READ_TIMEOUT:5s}
    # The Python reasoning runtime. Its read timeout is minutes rather than
    # seconds because one call can span several model calls before the run
    # reaches a boundary — and it always runs on the loop's own executor, never
    # on a request thread, so nothing user-facing waits on it.
    runtime:
      base-url: ${AGENT_RUNTIME_URL:http://localhost:8089}
      internal-token: ${AGENT_RUNTIME_INTERNAL_TOKEN:dev-internal-token}
      connect-timeout: ${AGENT_RUNTIME_CONNECT_TIMEOUT:2s}
      # One reduce can span several model calls, and the LAST one feeds the
      # whole tool output back to summarise — a research workflow returning a
      # 50,000-character report took over 4 minutes on its own. At 4m this
      # aborted 9 seconds before the runtime answered, losing a report that had
      # already cost 20 minutes and 100k tokens to produce.
      read-timeout: ${AGENT_RUNTIME_READ_TIMEOUT:15m}
    loop:
      # How long the agent watches an automation it started before reporting
      # "still running". Must comfortably exceed the longest automation, and
      # in particular the workflow run timeout in core-service — otherwise the
      # agent gives up on a workflow that is still going and reports a
      # non-answer for work that then completes.
      tool-timeout: ${AGENT_TOOL_TIMEOUT:25m}
      # The kill switch. False sends every run back to this service's own
      # ChatModel adapters — the loop that shipped before the Python runtime
      # existed. Meant to be flipped by someone who does not want to think
      # about it, so it is one variable and a restart.
      runtime-enabled: ${AGENT_RUNTIME_ENABLED:true}
    # Shared secret this service REQUIRES on its own /internal/** endpoints.
    internal-token: ${AGENT_INTERNAL_TOKEN:dev-internal-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
