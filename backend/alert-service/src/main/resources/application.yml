server:
  port: ${SERVER_PORT:8091}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:autoops_alerts}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:autoops}
    password: ${DB_PASSWORD:autoops}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate validating it would be a second
      # opinion nobody asked for; Hibernate CREATING it would build a schema no
      # environment runs, which is the blind spot that cost this project a
      # production migration failure once already.
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
  application:
    name: alert-service

autoops:
  alerts:
    # The shared platform token, same one core-service uses. One secret, not a
    # second to rotate — see InternalTokenFilter. Unset refuses every internal
    # call rather than opening the surface.
    internal-token: ${CORE_INTERNAL_TOKEN:}
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/oauth2/jwks}
    issuer: ${JWT_ISSUER:autoops-auth-service}
    # THE ENGINE. One Keep behind the whole product.
    #
    # These are the white-label boundary. There is no table holding them, no
    # endpoint returning them and no screen rendering them - a tenant cannot
    # learn the engine exists from anything AutoOps serves them.
    ingest:
      # Signs the token customers paste into Datadog, Grafana, an Airflow
      # DAG. Rotating it invalidates every issued token at once.
      secret: ${ALERT_INGEST_SECRET:dev-alert-ingest-secret-change-me}
      # The BROWSER-facing origin. A compose service name is useless in a
      # webhook field on someone else's SaaS.
      public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
    engine:
      url: ${KEEP_URL:http://keep-backend:8080}
      api-key: ${KEEP_API_KEY:}
      # Write key, used ONLY to connect/disconnect monitoring sources.
      # The engine has no role between read-only and admin, so this is an
      # admin key - which is exactly why it is not the one every read uses.
      admin-api-key: ${KEEP_ADMIN_KEY:}
      # write:alert only - the public ingest endpoint forwards with this
      # and it cannot read the alert stream back.
      ingest-api-key: ${KEEP_INGEST_KEY:}
      connect-timeout: ${KEEP_CONNECT_TIMEOUT:3s}
      read-timeout: ${KEEP_READ_TIMEOUT:10s}
      # Ceiling on ONE fetch from the engine. Filtering happens HERE, in Java,
      # never by handing the engine a caller-supplied expression - so this is
      # the size of the window we scan, not the size of the answer. Raising it
      # costs latency on every list call; it is not free.
      max-fetch: ${KEEP_MAX_FETCH:1000}

  # Correlation and root-cause analysis. Optional: blank HOLMES_URL turns
  # investigation off and the console hides it rather than erroring.
  ops:
    holmes:
      url: ${HOLMES_URL:}
      api-key: ${HOLMES_API_KEY:}
      connect-timeout: ${HOLMES_CONNECT_TIMEOUT:5s}
      # An investigation runs a dozen tools and several model round trips.
      # Never on a page load - only on an explicit request.
      read-timeout: ${HOLMES_READ_TIMEOUT:5m}
    # AutoOps's own agents. An AWS incident is investigated by the agent
    # that can join CloudWatch alarms to the CloudTrail change timeline,
    # on the tenant's own credentials - the engine above has no AWS tools.
    agent:
      base-url: ${AGENT_SERVICE_URL:http://agent-service:8087}
      rca-agent-name: ${AWS_RCA_AGENT_NAME:AWS Incident RCA Analyst}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
