# Demo variant of frontend/nginx.conf, bind-mounted over the image's copy by
# deploy-demo/docker-compose.demo.yml so going public needs no frontend rebuild.
#
# Exactly one thing differs from the original: X-Forwarded-Proto.
#
# ngrok terminates TLS at its edge and forwards plain HTTP into this container,
# so $scheme here is always "http". The original config passes $scheme straight
# through, which OVERWRITES the "https" ngrok sent and tells every service
# downstream that the visitor is on an insecure connection. The map below keeps
# the edge's value when there is one and falls back to $scheme otherwise, so a
# direct hit on http://localhost:5173 still behaves exactly as it does today.
#
# Keep this in step with frontend/nginx.conf if that file changes.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;

    root /usr/share/nginx/html;

    # Compression. The SPA bundle is ~1.4MB of JavaScript and the library list
    # is ~2MB of JSON; nginx's default config ships both uncompressed, which on
    # anything but a LAN is the single largest component of "the app feels
    # slow". Text compresses roughly 4-5x, so this is the cheapest latency
    # available anywhere in the stack.
    #
    # Level 5, not 9: past about 5 the extra CPU buys single-digit percentages
    # on payloads this size, and it is paid on every response.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    # Responses vary by encoding, and a shared cache must not hand a gzipped
    # body to a client that did not ask for one.
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    index index.html;

    # API + OAuth flows go through the gateway (which validates tokens and
    # routes to auth/subscription/core services).
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        # Appends ngrok's hop to the chain rather than replacing it, so the
        # services' rate limiters can find the real client IP. This is what
        # makes TRUSTED_PROXIES on auth-service worth setting.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /oauth2/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Artwork dropped in by hand: vendor logos, alert marks, tool icons. Unlike
    # the bundles below, the FILENAME is stable while the image behind it
    # changes: a vendor rebrands, someone swaps in a better mark. "immutable"
    # tells the browser never to revalidate, not even on a normal reload, so a
    # swapped logo stays invisible until someone thinks to hard-reload — and
    # every returning user keeps the old one indefinitely. Store it, but check
    # the ETag each time: a 304 is cheap and never wrong.
    #
    # Regex wins over the /assets/ prefix below regardless of order.
    location ~ ^/assets/(models|alerts|Icons|cards)/ {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets never change content under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must always revalidate or browsers keep serving a stale
    # bundle after a redeploy (buttons wired to new code silently do nothing).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
