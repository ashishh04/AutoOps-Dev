# ============================================================
# AutoOps — the whole platform as one Docker Compose project.
#
#   docker compose up -d --build      # build + start everything
#   docker compose logs -f auth-service   # watch OTP codes (dev profile logs them)
#   docker compose down               # stop (add -v to also wipe the database)
#
# Containers: mysql + redis (internal), auth-service :8081,
# subscription-service :8082, core-service :8083, voice-agent :8085,
# api-gateway :8080,
# frontend :5173 (nginx serving the SPA, /api proxied to the gateway).
# Open http://localhost:5173 — the browser only talks to the frontend origin.
#
# This stack is self-contained: its MySQL publishes host port 3308 (debug
# access only) so it never clashes with the auth-service/docker-compose.yml
# dev infra on 3307. SSO/Keycloak is not wired here — password + OTP login
# works; SSO buttons need the separate dev keycloak.
# ============================================================
name: autoops

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: autoops_auth
      MYSQL_USER: autoops
      MYSQL_PASSWORD: autoops
    ports:
      # Debug access from the host only; services use mysql:3306 internally.
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # First-init only: creates autoops_subscription + autoops_core (+ grants).
      - ./backend/auth-service/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    # Internal only — no host port, so the dev redis on 6379 never clashes.

  auth-service:
    build: ./backend/auth-service
    environment:
      # dev profile: auto-generated JWT keys; OTP codes are ALSO logged to the
      # console (fallback when SendGrid isn't configured).
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      # Entitlement checks (/authorize, enterprise-SSO config gating).
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8082
      # Real email: put SENDGRID_API_KEY + SENDGRID_FROM_EMAIL in ./.env
      # (see .env.example). Without a template id, plain-text emails are sent.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-REPLACE_ME}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-no-reply@autoops.io}
      SENDGRID_OTP_TEMPLATE_ID: ${SENDGRID_OTP_TEMPLATE_ID:-REPLACE_ME}
      # Social login (Google/Microsoft) — put credentials in ./.env; a blank
      # client-id leaves that provider disabled (503 sso_not_configured).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 30s

  subscription-service:
    build: ./backend/subscription-service
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      AUTH_JWKS_URI: http://auth-service:8081/oauth2/jwks
      # PAYMENT_STUB_FAILS=true docker compose up -d subscription-service
      # makes every charge decline (exercises PAST_DUE + /api/payments/retry).
      PAYMENT_STUB_FAILS: ${PAYMENT_STUB_FAILS:-false}
      # Shared secret for /internal/** (core-service scheduler checks).
      SUBSCRIPTION_INTERNAL_TOKEN: ${SUBSCRIPTION_INTERNAL_TOKEN:-dev-internal-token}
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 30s

  # Step execution runtime (Rundeck-style): actually runs job/workflow steps
  # — shell commands, scripts, python, ssh, REST, terraform (OpenTofu),
  # kubectl, AWS Lambda and Azure Function invokes — and verifies stored cloud
  # credentials against the real providers (/internal/verify). INTERNAL ONLY:
  # no host port, not routed by the gateway; core-service authenticates with
  # the shared internal token. ssh steps need a key volume mounted at
  # /home/autoops/.ssh, which this stack does not provide yet.
  job-service:
    build: ./backend/job-service
    # A timed-out step's grandchildren are reparented to PID 1. The JVM does
    # not reap processes it never spawned, so without an init they pile up as
    # zombies until the container runs out of PIDs. docker-init reaps them.
    init: true
    environment:
      JOB_INTERNAL_TOKEN: ${JOB_INTERNAL_TOKEN:-dev-internal-token}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8084/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 20s

  core-service:
    build: ./backend/core-service
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      AUTH_JWKS_URI: http://auth-service:8081/oauth2/jwks
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8082
      # Real step execution. `rundeck` = the platform engine (the replacement);
      # `remote` = job-service (the rollback); unset = simulated.
      EXECUTION_MODE: ${EXECUTION_MODE:-rundeck}
      JOB_SERVICE_URL: http://job-service:8084
      JOB_INTERNAL_TOKEN: ${JOB_INTERNAL_TOKEN:-dev-internal-token}
      SUBSCRIPTION_INTERNAL_TOKEN: ${SUBSCRIPTION_INTERNAL_TOKEN:-dev-internal-token}
      # agent-runtime executes NATIVE workflow graphs (the Dify replacement).
      # Deliberately NOT a depends_on: a workflow run failing because the
      # runtime is down must not also stop jobs, projects and approvals from
      # working — core-service reports the outage on the run instead.
      AGENT_RUNTIME_URL: http://agent-runtime:8089
      AGENT_RUNTIME_INTERNAL_TOKEN: ${AGENT_RUNTIME_INTERNAL_TOKEN:-dev-internal-token}
      # The model a workflow's llm node uses when its definition names none.
      # Empty is valid: a graph with no llm node needs no model at all.
      RUNTIME_DEFAULT_MODEL: ${RUNTIME_DEFAULT_MODEL:-}
      # Cloud credential encryption at rest (set a strong secret in ./.env).
      CLOUD_CRED_KEY: ${CLOUD_CRED_KEY:-dev-cloud-cred-key}
      # Workflow definitions live in workflow-service now; the run engine,
      # approvals, governance, SCM sync and compliance all read them from there.
      WORKFLOW_SERVICE_URL: http://workflow-service:8086
      WORKFLOW_INTERNAL_TOKEN: ${WORKFLOW_INTERNAL_TOKEN:-dev-internal-token}
      # Agents are BUILT by the provider here and rolled out to tenants, so
      # this service writes into agent-service. Deliberately NOT a depends_on:
      # agent-service already depends on this one for tool targets, and the
      # rollout call only happens on demand — a startup edge would deadlock.
      AGENT_SERVICE_URL: http://agent-service:8087
      # Probe-only, for the provider Platform Health page. Also NOT a
      # depends_on: api-gateway already waits on this service, so requiring it
      # back would deadlock startup — the probe reports DOWN until it is up.
      VOICE_SERVICE_URL: http://voice-agent:8085
      GATEWAY_URL: http://api-gateway:8080
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-dev-internal-token}
      # Outbound notifications. Also NOT a depends_on: delivery is
      # best-effort, so a plugin-service that is down must slow nothing and
      # fail no run — the emitter logs and moves on.
      PLUGIN_SERVICE_URL: http://plugin-service:8088
      PLUGIN_INTERNAL_TOKEN: ${PLUGIN_INTERNAL_TOKEN:-dev-internal-token}
      # THE EXECUTION ENGINE. `rundeck` replaces `remote` (job-service):
      # every step in every project in every tenant runs on the platform
      # Rundeck. Set EXECUTION_MODE=remote to roll back to job-service — one
      # variable and a restart, which is the only honest way to ship an engine
      # swap.
      RUNDECK_SERVICE_URL: http://rundeck-service:8090
      RUNDECK_INTERNAL_TOKEN: ${RUNDECK_INTERNAL_TOKEN:-dev-internal-token}
      CONSOLE_BASE_URL: ${CONSOLE_BASE_URL:-http://localhost:5173}
      # Shared secret workflow-service and agent-service must present on
      # this service's own /internal/** endpoints.
      CORE_INTERNAL_TOKEN: ${CORE_INTERNAL_TOKEN:-dev-internal-token}
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 30s

  # Automation workflow DEFINITIONS (autoops_workflow). Split out of
  # core-service: it owns the canvas and its plan limits, while runs,
  # approvals and audit stay in core-service and are reached over
  # /internal. Deliberately NOT started with depends_on: core-service
  # ready — the two call each other, so a hard ordering would deadlock;
  # each degrades gracefully while the other comes up.
  workflow-service:
    build: ./backend/workflow-service
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: autoops_workflow
      AUTH_JWKS_URI: http://auth-service:8081/oauth2/jwks
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8082
      CORE_SERVICE_URL: http://core-service:8083
      CORE_INTERNAL_TOKEN: ${CORE_INTERNAL_TOKEN:-dev-internal-token}
      AGENT_SERVICE_URL: http://agent-service:8087
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-dev-internal-token}
      WORKFLOW_INTERNAL_TOKEN: ${WORKFLOW_INTERNAL_TOKEN:-dev-internal-token}
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8086/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 30s

  # AI agents (autoops_agent). An agent's tools allow-list is validated
  # against core-service (jobs) and workflow-service (workflows) on every
  # write, and its audit events are posted back to core-service.
  agent-service:
    build: ./backend/agent-service
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: autoops_agent
      AUTH_JWKS_URI: http://auth-service:8081/oauth2/jwks
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8082
      CORE_SERVICE_URL: http://core-service:8083
      CORE_INTERNAL_TOKEN: ${CORE_INTERNAL_TOKEN:-dev-internal-token}
      WORKFLOW_SERVICE_URL: http://workflow-service:8086
      WORKFLOW_INTERNAL_TOKEN: ${WORKFLOW_INTERNAL_TOKEN:-dev-internal-token}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-dev-internal-token}
      AGENT_RUNTIME_URL: http://agent-runtime:8089
      AGENT_RUNTIME_INTERNAL_TOKEN: ${AGENT_RUNTIME_INTERNAL_TOKEN:-dev-internal-token}
      # The kill switch. Set false to send every run back to this service's own
      # Java chat adapters — the loop that shipped before agent-runtime existed.
      AGENT_RUNTIME_ENABLED: ${AGENT_RUNTIME_ENABLED:-true}
      AGENT_TOOL_TIMEOUT: ${AGENT_TOOL_TIMEOUT:-25m}
      # Must outlast the slowest single reduce, not the slowest tool.
      AGENT_RUNTIME_READ_TIMEOUT: ${AGENT_RUNTIME_READ_TIMEOUT:-15m}
    ports:
      - "8087:8087"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
      # Deliberately NOT a depends_on. agent-runtime being down must fail the
      # RUNS that need it, not stop this service booting — it also serves agent
      # CRUD, the catalog and rollout, none of which touch the runtime. Making
      # it a hard dependency would take the console's agent screens down with
      # a reasoning outage.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8087/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 30s

  # The reasoning half of the agents (Python 3.12 / FastAPI / LangGraph).
  #
  # STATELESS by construction: no database, no cache, no session. Every request
  # from agent-service carries the entire run state, and this service hands back
  # a new one. That is what makes it safe to restart mid-investigation, and why
  # it has no volume and no depends_on for mysql.
  #
  # Not exposed through api-gateway. Its only caller is agent-service, over this
  # network, holding the shared secret. The published port is for local
  # debugging (GET /health reports which agents and prompt version are loaded).
  agent-runtime:
    build: ./backend/agent-runtime
    environment:
      # The ONE call agent-runtime makes back into the control plane: a
      # workflow's `job` node asking core-service to dispatch an automation.
      # It executes nothing itself — core-service still owns credentials, the
      # approvals gate and the audit trail.
      AGENT_RUNTIME_CORE_BASE_URL: http://core-service:8083
      AGENT_RUNTIME_CORE_INTERNAL_TOKEN: ${CORE_INTERNAL_TOKEN:-dev-internal-token}
      AGENT_RUNTIME_INTERNAL_TOKEN: ${AGENT_RUNTIME_INTERNAL_TOKEN:-dev-internal-token}
      AGENT_RUNTIME_MAX_TOKENS: ${AGENT_RUNTIME_MAX_TOKENS:-4096}
      # LangSmith tracing. Opt-in, off by default, and it never fails a run:
      # with the switch on and no key the runtime logs one warning and carries
      # on untraced. One trace per reduce with each phase nested inside it; a
      # run's several reduces are stitched into one LangSmith thread by the run
      # id, so an investigation that parked on an approval for two days is
      # still one conversation rather than four unrelated traces.
      AGENT_RUNTIME_LANGSMITH_ENABLED: ${LANGSMITH_ENABLED:-false}
      AGENT_RUNTIME_LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      # One project per environment. A staging run sitting beside a production
      # one in the same trace list is how an investigation reaches the wrong
      # conclusion about which build did what.
      AGENT_RUNTIME_LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-autoops-agents}
      # Override for LangSmith's EU host or a self-hosted instance. Where a
      # customer's infrastructure detail may be sent is a contractual question,
      # not a default.
      AGENT_RUNTIME_LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      # Trace the shape without the content: phases, timings, token counts and
      # errors are kept; message bodies and tool output never leave the process.
      AGENT_RUNTIME_LANGSMITH_HIDE_IO: ${LANGSMITH_HIDE_IO:-false}
    ports:
      # 8089, not 8088 — plugin-service already publishes 8088.
      - "8089:8089"

  # Notification channels (autoops_plugin). Owns the Slack/Teams/Outlook/
  # Gmail/GitHub/webhook plugins, each tenant's encrypted credentials for
  # them, and the rules binding job and workflow lifecycle events to
  # channels. core-service posts events to /internal/events; delivery then
  # happens on this service's own worker pool, so a slow third party can
  # never hold up a run. Deliberately NOT a depends_on of core-service:
  # notification delivery is best-effort and must not gate the run engine.
  plugin-service:
    build: ./backend/plugin-service
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: autoops_plugin
      AUTH_JWKS_URI: http://auth-service:8081/oauth2/jwks
      # Encryption at rest for webhook URLs, API tokens and SMTP passwords.
      # Separate from CLOUD_CRED_KEY on purpose — one leaked key must not
      # open both vaults. Set a strong value in ./.env.
      PLUGIN_CRED_KEY: ${PLUGIN_CRED_KEY:-dev-plugin-cred-key}
      # Shared secret core-service must present on /internal/**.
      PLUGIN_INTERNAL_TOKEN: ${PLUGIN_INTERNAL_TOKEN:-dev-internal-token}
      # Used to build the "Open in AutoOps" deep link inside a notification.
      CONSOLE_BASE_URL: ${CONSOLE_BASE_URL:-http://localhost:5173}
    ports:
      - "8088:8088"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8088/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 30s

  # THE EXECUTION ENGINE. Rundeck plus every binary job-service used to
  # provide — OpenTofu, kubectl, python3+boto3, the AWS CLI — pinned in
  # backend/rundeck-runtime/Dockerfile.
  #
  # NO host port. This is the white-label boundary: nothing outside the compose
  # network reaches it, no gateway route points at it, and no tenant is ever
  # told it exists. Publishing 4440 "for debugging" would put the engine's login
  # page on the operator's laptop and the brand on the customer's screenshot.
  #
  # Storage is the stock H2 file database in the container's volume. That is
  # fine for a single-instance engine and is NOT fine for two — see the service
  # README's Known gaps before scaling this to a second replica.
  rundeck:
    build: ./backend/rundeck-runtime
    environment:
      # The URL Rundeck believes it is reachable at. It only ever serves
      # rundeck-service, so the internal name is the honest value.
      RUNDECK_GRAILS_URL: http://rundeck:4440
      RUNDECK_SERVER_FORWARDED: "true"
      # Bootstraps the admin API token rundeck-service authenticates with, so
      # the stack comes up runnable without a human clicking through the
      # Rundeck UI to mint one.
      RUNDECK_TOKENS_FILE: /home/rundeck/etc/tokens.properties
      RUNDECK_LOGGING_STRATEGY: CONSOLE
    volumes:
      - rundeck-data:/home/rundeck/server/data
      # Read-only: the engine reads this at boot and must never rewrite it.
      # Ships a DEV token — override the file (or bake your own image) anywhere
      # that is not a laptop. See the file's own header.
      - ./backend/rundeck-runtime/tokens.properties:/home/rundeck/etc/tokens.properties:ro
    healthcheck:
      # Rundeck is slow to boot (Grails + schema init), hence the long
      # start_period — a shorter one marks it unhealthy while it is still fine.
      test: ["CMD-SHELL", "curl -fsS http://localhost:4440/api/41/system/info -H \"X-Rundeck-Auth-Token: $${RUNDECK_API_TOKEN:-autoops-platform-token}\" >/dev/null || exit 1"]
      interval: 15s
      retries: 20
      start_period: 120s

  # The adapter in front of the engine (autoops_rundeck). core-service calls it
  # to run a step; it provisions the tenant's Rundeck project, translates the
  # step into a script, dispatches, polls and returns the log.
  #
  # It has NO /api/** surface and no gateway route — its only caller is
  # core-service over X-Internal-Token. That is what keeps the engine's URL and
  # admin token in one service no tenant-facing request can reach.
  rundeck-service:
    build: ./backend/rundeck-service
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: autoops_rundeck
      AUTH_JWKS_URI: http://auth-service:8081/oauth2/jwks
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8082
      CORE_SERVICE_URL: http://core-service:8083
      CORE_INTERNAL_TOKEN: ${CORE_INTERNAL_TOKEN:-dev-internal-token}
      # Shared secret core-service must present to run a step. This one guards
      # execution for EVERY tenant on the platform — set a real value.
      RUNDECK_INTERNAL_TOKEN: ${RUNDECK_INTERNAL_TOKEN:-dev-internal-token}
      # The engine. Internal name, internal token, never exposed.
      RUNDECK_URL: http://rundeck:4440
      RUNDECK_API_TOKEN: ${RUNDECK_API_TOKEN:-autoops-platform-token}
      # 44 is a FLOOR, not a preference: JSON job import
      # (/project/{p}/jobs/import?format=json) is rejected below it with
      # "Minimum supported version: 44", and that endpoint is how an
      # AutoOps job becomes a real Rundeck job. 50 is what the bundled
      # engine itself reports.
      RUNDECK_API_VERSION: ${RUNDECK_API_VERSION:-50}
      # Ceiling on one step, mirroring job-service's hard cap. A step that hits
      # it is ABORTED upstream, never abandoned mid-change.
      RUNDECK_STEP_TIMEOUT: ${RUNDECK_STEP_TIMEOUT:-10m}
    ports:
      - "8090:8090"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
      rundeck:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8090/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 30s

  # Aegis-01, the landing-page voice agent. Holds the ElevenLabs API key and
  # hands the browser nothing but a 15-minute signed WebSocket URL. Its two
  # endpoints are anonymous (visitors have no account), so it rate-limits them
  # itself — that cap is what protects the ElevenLabs credits. Without
  # ELEVENLABS_API_KEY + ELEVENLABS_AGENT_ID in ./.env it reports itself
  # disabled and the landing page simply omits the talk button.
  voice-agent:
    build: ./backend/voice-agent
    environment:
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-REPLACE_ME}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-REPLACE_ME}
      VOICE_AGENT_NAME: ${VOICE_AGENT_NAME:-Aegis-01}
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8085/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 20s

  api-gateway:
    build: ./backend/api-gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8082
      CORE_SERVICE_URL: http://core-service:8083
      WORKFLOW_SERVICE_URL: http://workflow-service:8086
      AGENT_SERVICE_URL: http://agent-service:8087
      PLUGIN_SERVICE_URL: http://plugin-service:8088
      RUNDECK_SERVICE_URL: http://rundeck-service:8090
      # Belongs HERE, not in docker-compose.keep.yml, even though alert-service
      # only runs when that overlay is active. The gateway's route defaults to
      # ${ALERT_SERVICE_URL:http://localhost:8091}, and localhost inside this
      # container is the GATEWAY — so an unset value does not disable the route,
      # it makes the gateway call itself and answer 500 on every alerts page.
      # Pointing at the real service name fails honestly (connection refused)
      # when the overlay is off, instead of misleadingly.
      ALERT_SERVICE_URL: http://alert-service:8091
      VOICE_SERVICE_URL: http://voice-agent:8085
      AUTH_JWKS_URI: http://auth-service:8081/oauth2/jwks
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
      core-service:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
      agent-service:
        condition: service_healthy
      plugin-service:
        condition: service_healthy
      rundeck-service:
        condition: service_healthy
      voice-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  mysql-data:
  rundeck-data:
